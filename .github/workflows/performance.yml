name: Performance Gate

# Manual-trigger only — see performance-testing/README.md for why (no
# staging environment, load-testing a real host should be opt-in). Can be
# dispatched from the Actions tab, or programmatically via
# POST /api/performance/run on the backend (backend/.../GithubActionsClient).
on:
  workflow_dispatch:
    inputs:
      system:
        description: 'Which system to load-test'
        required: true
        default: 'qaip'
        type: choice
        options:
          - qaip
          - aria
      host:
        description: 'Base URL to load-test (e.g. https://testmind-production.up.railway.app)'
        required: true
      users:
        description: 'Concurrent simulated users'
        required: false
        default: '50'
      run_time:
        description: 'Test duration (e.g. 5m)'
        required: false
        default: '5m'

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust

      - name: Restore performance baseline
        uses: actions/cache@v4
        with:
          path: performance-testing/baseline.json
          key: perf-baseline-${{ github.event.inputs.system }}-${{ github.ref_name }}

      - name: Run load test (QAIP)
        if: github.event.inputs.system == 'qaip'
        run: |
          locust -f performance-testing/locustfile.py \
            --host ${{ github.event.inputs.host }} \
            --headless --users ${{ github.event.inputs.users }} --spawn-rate 10 \
            --run-time ${{ github.event.inputs.run_time }} \
            --test-email "${{ secrets.PERF_TEST_EMAIL }}" \
            --test-password "${{ secrets.PERF_TEST_PASSWORD }}" \
            --csv=results/perf_run

      - name: Run load test (ARIA)
        if: github.event.inputs.system == 'aria'
        run: |
          locust -f performance-testing/aria_locustfile.py \
            --host ${{ github.event.inputs.host }} \
            --headless --users ${{ github.event.inputs.users }} --spawn-rate 10 \
            --run-time ${{ github.event.inputs.run_time }} \
            --test-student-id "${{ secrets.ARIA_PERF_TEST_STUDENT_ID }}" \
            --csv=results/perf_run

      - name: Analyze results, check for regressions, push to backend
        env:
          PERFORMANCE_API_URL: ${{ secrets.PERFORMANCE_API_URL }}
          PERFORMANCE_CALLBACK_SECRET: ${{ secrets.PERFORMANCE_CALLBACK_SECRET }}
          PERFORMANCE_SYSTEM: ${{ github.event.inputs.system }}
        run: |
          python performance-testing/metrics_analyzer.py \
            results/perf_run_stats.csv \
            performance-testing/baseline.json
        # Non-zero exit code here fails this step — wire this job into
        # ci.yml's deploy job via "needs:" if you want a build that got
        # slower under load to be blocked rather than shipped silently.
        # The push to PERFORMANCE_API_URL is best-effort and does not
        # affect this step's pass/fail (see metrics_analyzer.py's
        # push_results()) — it's a no-op if those secrets aren't set.

      - name: Save updated baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: performance-testing/baseline.json
          key: perf-baseline-${{ github.event.inputs.system }}-${{ github.ref_name }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.event.inputs.system }}
          path: results/
          retention-days: 30
