# Strimzi-managed Kafka cluster running inside the same K8s cluster
# as qaip-core-api. AWS MSK is the equivalent managed option if you'd
# rather not operate Kafka yourself.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: qaip-kafka
  namespace: qaip
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: persistent-claim
      size: 20Gi
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: commit-events
  namespace: qaip
  labels:
    strimzi.io/cluster: qaip-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000   # 7 days
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: risk-analysis-results
  namespace: qaip
  labels:
    strimzi.io/cluster: qaip-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: p0-defect-alerts
  namespace: qaip
  labels:
    strimzi.io/cluster: qaip-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
