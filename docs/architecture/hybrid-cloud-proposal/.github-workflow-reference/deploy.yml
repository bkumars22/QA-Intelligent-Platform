name: Deploy QAIP Hybrid Architecture

on:
  push:
    branches: [main]

jobs:
  # ---- Core services (Java Spring Boot) -> Kubernetes ----
  deploy-core-services:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'core-api/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/qaip-core-api:${{ github.sha }} core-api/
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/qaip-core-api:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/qaip-core-api \
            qaip-core-api=ghcr.io/${{ github.repository }}/qaip-core-api:${{ github.sha }} \
            -n qaip
          kubectl rollout status deployment/qaip-core-api -n qaip --timeout=180s

  # ---- Serverless AI layer (Python) -> AWS Lambda ----
  deploy-ai-functions:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'serverless/')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build and push Lambda container image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker build -t ${{ secrets.ECR_REGISTRY }}/qaip-ai-inference:${{ github.sha }} serverless/
          docker push ${{ secrets.ECR_REGISTRY }}/qaip-ai-inference:${{ github.sha }}

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name qaip-ai-inference \
            --image-uri ${{ secrets.ECR_REGISTRY }}/qaip-ai-inference:${{ github.sha }}
          aws lambda wait function-updated --function-name qaip-ai-inference

  # ---- Event bus config (Kafka topics) -> applied via Strimzi ----
  deploy-event-bus:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'event-bus/')
    steps:
      - uses: actions/checkout@v4
      - name: Apply Kafka topic definitions
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl apply -f event-bus/kafka-topics.yaml

  # ---- Security policies -> applied last, always re-verified ----
  verify-security-policies:
    runs-on: ubuntu-latest
    needs: [deploy-core-services, deploy-ai-functions]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify NetworkPolicy + mTLS
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl apply -f security/network-policy.yaml
          kubectl apply -f security/mtls-strict.yaml
          kubectl get networkpolicy -n qaip
